<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Snake</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="top-bar">
            <a href="../index.html" class="back-btn">← BACK TO HUB</a>
            <h1 class="title">NEON SNAKE</h1>
        </div>
        <div class="score-board">
            <div class="score-item">
                <span class="label">SCORE</span>
                <span id="score" class="value">0</span>
            </div>
            <div class="score-item">
                <span class="label">HIGH SCORE</span>
                <span id="highScore" class="value">0</span>
            </div>
        </div>
        <canvas id="gameCanvas"></canvas>
        <div class="controls">
            <button id="startBtn" class="btn neon-btn">START</button>
            <button id="musicBtn" class="btn neon-btn">MUSIC: ON</button>
            <button id="saveBtn" class="btn neon-btn">SAVE</button>
            <button id="resetBtn" class="btn neon-btn danger">RESET</button>
        </div>
        <div class="instructions">
            <div class="key-row">
                <span class="key-badge">↑↓←→</span> or <span class="key-badge">W A S D</span>
                <span class="key-label">Move</span>
            </div>
            <div class="key-row">
                <span class="key-badge">SPACE</span>
                <span class="key-label">Start / Pause</span>
            </div>
            <div class="key-row">
                <span class="key-badge">CTRL+S</span>
                <span class="key-label">Save Progress</span>
            </div>
            <div class="key-row">
                <span class="key-badge">R</span>
                <span class="key-label">Reset Progress</span>
            </div>
            <div class="key-row">
                <span class="key-badge">M</span>
                <span class="key-label">Toggle Music</span>
            </div>
        </div>
        <div id="message" class="message hidden"></div>
    </div>
    <script src="game.js"></script>
</body>
</html>
