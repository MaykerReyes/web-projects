<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Video Downloader</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

  <div class="app">
    <header class="header">
      <div class="header-icon">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="23 7 16 12 23 17 23 7"/>
          <rect x="1" y="5" width="15" height="14" rx="2" ry="2"/>
        </svg>
      </div>
      <h1>Video Downloader</h1>
      <p class="header-sub">YouTube &middot; Facebook &middot; Instagram</p>
    </header>

    <main class="main">
      <div class="card input-card">
        <div class="input-row">
          <div class="input-wrap">
            <svg class="input-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/>
              <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>
            </svg>
            <input type="text" id="urlInput" class="url-input" placeholder="Paste video URL from YouTube, Facebook, or Instagram..." autofocus>
          </div>
          <button id="fetchBtn" class="btn btn-primary">Fetch Info</button>
        </div>
        <div id="errorMsg" class="error-msg"></div>
      </div>

      <div id="infoCard" class="card info-card hidden">
        <div class="info-layout">
          <div class="thumbnail-wrap">
            <img id="thumbnail" class="thumbnail" src="" alt="Video thumbnail">
            <span id="durationBadge" class="duration-badge"></span>
          </div>
          <div class="info-body">
            <span id="platformBadge" class="platform-badge"></span>
            <h2 id="videoTitle" class="video-title"></h2>
            <p id="videoUploader" class="video-uploader"></p>

            <div class="quality-row">
              <label class="quality-label" for="qualitySelect">Quality</label>
              <div class="quality-select-wrap">
                <select id="qualitySelect" class="quality-select">
                  <option value="best">Best Video</option>
                  <option value="1080p">1080p</option>
                  <option value="720p">720p</option>
                  <option value="480p">480p</option>
                  <option value="audio">Audio Only (M4A)</option>
                  <option value="mp3">MP3 Only</option>
                </select>
                <svg class="select-chevron" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <polyline points="6 9 12 15 18 9"/>
                </svg>
              </div>
            </div>

            <button id="downloadBtn" class="btn btn-download">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                <polyline points="7 10 12 15 17 10"/>
                <line x1="12" y1="15" x2="12" y2="3"/>
              </svg>
              Download
            </button>
          </div>
        </div>

        <div id="progressSection" class="progress-section hidden">
          <div class="progress-bar-track">
            <div id="progressFill" class="progress-bar-fill" style="width: 0%"></div>
          </div>
          <div class="progress-meta">
            <span id="progressPct" class="progress-pct">0%</span>
            <span id="progressSpeed" class="progress-speed"></span>
            <span id="progressEta" class="progress-eta"></span>
            <button id="cancelBtn" class="btn-cancel" title="Cancel">Cancel</button>
          </div>
        </div>
      </div>

      <div class="card downloads-card">
        <div class="card-header">
          <h3>Downloads</h3>
          <span id="downloadCount" class="download-count">0</span>
        </div>
        <div id="downloadsList" class="downloads-list">
          <div class="empty-state">
            <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.3">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
              <polyline points="7 10 12 15 17 10"/>
              <line x1="12" y1="15" x2="12" y2="3"/>
            </svg>
            <p>No downloads yet</p>
          </div>
        </div>
      </div>
    </main>
  </div>

  <div id="toast" class="toast hidden"></div>

  <script src="/js/app.js"></script>
</body>
</html>
